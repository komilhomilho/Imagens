name: Atualizar README Automaticamente

on:
  push:
    branches:
      - main

# Adicione estas permissões no topo do arquivo do workflow também para garantir
permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar script de atualização
        run: python .github/scripts/atualizar_readme.py

      - name: Commitar e enviar alterações para o GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: atualização automática do README com novas imagens"
          branch: main
          # Adicione esta linha para injetar o token de acesso do repositório:
          file_pattern: README.md
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}